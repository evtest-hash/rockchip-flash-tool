name: Build And Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_onefile:
        description: "Also build a single-file Windows exe, for comparing startup cost"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build macOS universal DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build macOS package
        run: bash scripts/package_macos_pyqt.sh

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/Rockchip-Flash-Tool-macOS-universal.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows EXE
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Windows package
        shell: pwsh
        run: ./scripts/package_windows_pyqt.ps1

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/Rockchip-Flash-Tool-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      # Opt-in comparison build. PyInstaller onefile unpacks the whole bundle to
      # %TEMP% on every launch, so this exists to measure that cost on real
      # hardware rather than argue about it.
      - name: Build single-file Windows exe
        if: ${{ inputs.windows_onefile }}
        shell: pwsh
        run: |
          $venvPython = ".venv-win/Scripts/python.exe"
          & $venvPython -m PyInstaller `
            --noconfirm --clean --windowed --onefile `
            --name "Rockchip Flash Tool onefile" `
            --icon "assets/icon.ico" `
            --add-data "assets/icon.ico;assets" `
            --add-data "tools;tools" `
            --add-data "rkbin;rkbin" `
            rk_flash_tool/__main__.py
          Get-Item "dist/Rockchip Flash Tool onefile.exe" |
            Select-Object Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Upload single-file Windows exe
        if: ${{ inputs.windows_onefile }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-onefile
          path: dist/Rockchip Flash Tool onefile.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache linuxdeploy
        uses: actions/cache@v4
        with:
          path: .cache
          key: linuxdeploy-${{ runner.os }}-x86_64

      - name: Install Linux runtime deps for bundling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libfuse2 \
            libgbm1 \
            libopengl0 \
            patchelf \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xkb1 \
            libxcb-util1 \
            libxcb-image0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0

      - name: Build Linux package
        run: bash scripts/package_linux_pyqt.sh

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/Rockchip-Flash-Tool-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  # Smoke tests: prove the artifact is well formed, starts on the target OS and
  # carries a working upgrade_tool. Flashing itself needs a USB device and
  # cannot be covered here.
  #
  # Apple Silicon only. Intel runners can sit queued for a long time, and
  # continue-on-error does not help: gate still waits for the leg to finish. The
  # runner ships Rosetta 2, so the x86_64 half of the universal build is covered
  # from here instead.
  smoke-macos:
    name: Smoke macOS
    needs: build-macos
    runs-on: macos-15
    steps:
      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts

      - name: Mount DMG and stage the app
        run: |
          set -euo pipefail
          hdiutil attach artifacts/Rockchip-Flash-Tool-macOS-universal.dmg \
            -mountpoint /Volumes/rkft -nobrowse -readonly
          cp -R "/Volumes/rkft/Rockchip Flash Tool.app" "$RUNNER_TEMP/"
          hdiutil detach /Volumes/rkft
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/Rockchip Flash Tool.app" || true

      - name: Check bundle shape
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Rockchip Flash Tool.app"
          BIN="$APP/Contents/MacOS/Rockchip Flash Tool"
          test -x "$BIN"
          codesign -v --verbose=2 "$APP"
          archs="$(lipo -archs "$BIN")"
          echo "archs: $archs"
          grep -q x86_64 <<<"$archs"
          grep -q arm64 <<<"$archs"

      - name: Launch app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Rockchip Flash Tool.app"
          export RK_FLASH_TOOL_AUTO_EXIT_MS=2500 QT_DEBUG_PLUGINS=1
          "$APP/Contents/MacOS/Rockchip Flash Tool" >launch.log 2>&1 &
          pid=$!
          for _ in $(seq 1 40); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" || true
            echo "::error::app did not exit within 40s"
            sed -n '1,60p' launch.log || true
            exit 1
          fi
          set +e
          wait "$pid"
          rc=$?
          set -e
          sed -n '1,60p' launch.log || true
          if [[ $rc -ne 0 ]]; then
            echo "::error::app exited with $rc"
            exit 1
          fi
          if grep -qi "could not load the Qt platform plugin" launch.log; then
            echo "::error::Qt platform plugin failed to load"
            exit 1
          fi

      - name: Run bundled upgrade_tool
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Rockchip Flash Tool.app"
          # All three platforms' tool directories are bundled, so match the
          # darwin one explicitly -- the Linux ELF would exec-fail with 126.
          tool="$(find "$APP" -type f -path '*/tools/darwin/upgrade_tool' -print -quit)"
          if [[ -z "$tool" ]]; then
            echo "::error::bundled darwin upgrade_tool missing from the app bundle"
            find "$APP" -type f -name 'upgrade_tool*' || true
            exit 1
          fi
          echo "found: $tool"
          chmod +x "$tool"
          "$tool" -v || true
          # LD with no device attached prints "connected(0)" and exits 0.
          "$tool" LD

      - name: Run bundled upgrade_tool as x86_64 under Rosetta
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Rockchip Flash Tool.app"
          tool="$(find "$APP" -type f -path '*/tools/darwin/upgrade_tool' -print -quit)"
          arch -x86_64 "$tool" LD

      - name: Launch the app as x86_64 under Rosetta
        # Exercises the x86_64 half of the bundled Python and Qt stack, not just
        # the flashing tool. Rosetta's first translation takes ~15s, hence the
        # roomier budget than the native launch.
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Rockchip Flash Tool.app"
          export RK_FLASH_TOOL_AUTO_EXIT_MS=2500
          arch -x86_64 "$APP/Contents/MacOS/Rockchip Flash Tool" >rosetta-launch.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" || true
            echo "::error::x86_64 app did not exit within 60s"
            sed -n '1,60p' rosetta-launch.log || true
            exit 1
          fi
          set +e
          wait "$pid"
          rc=$?
          set -e
          sed -n '1,60p' rosetta-launch.log || true
          if [[ $rc -ne 0 ]]; then
            echo "::error::x86_64 app exited with $rc"
            exit 1
          fi

      - name: Upload launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-macos-logs
          path: |
            launch.log
            rosetta-launch.log
          if-no-files-found: warn

  smoke-windows:
    name: Smoke Windows
    needs: build-windows
    runs-on: windows-2022
    steps:
      - name: Download Windows zip artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts

      - name: Unpack and check layout
        shell: pwsh
        run: |
          Expand-Archive -Path "artifacts\Rockchip-Flash-Tool-windows-x64.zip" -DestinationPath app -Force
          if (-not (Test-Path "app\Rockchip Flash Tool.exe")) { throw "Rockchip Flash Tool.exe missing from the zip" }
          if (-not (Test-Path "app\_internal")) { throw "_internal directory missing from the zip" }

      - name: Launch app
        shell: pwsh
        run: |
          $env:RK_FLASH_TOOL_AUTO_EXIT_MS = "2500"
          $p = Start-Process -FilePath "app\Rockchip Flash Tool.exe" -PassThru -NoNewWindow `
                 -RedirectStandardOutput launch.out -RedirectStandardError launch.err
          if (-not $p.WaitForExit(60000)) {
            $p.Kill()
            throw "app did not exit within 60s"
          }
          Get-Content launch.out, launch.err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "app exited with $($p.ExitCode)" }

      - name: Run bundled upgrade_tool
        shell: pwsh
        run: |
          $t = Get-ChildItem -Path app -Recurse -Filter upgrade_tool.exe |
                 Where-Object { $_.FullName -match '\\tools\\windows\\' } | Select-Object -First 1
          if (-not $t) { throw "bundled windows upgrade_tool.exe missing from the zip" }
          Write-Host "found: $($t.FullName)"
          # Verified on the runner: with no rockusb driver and no device, LD
          # still prints "connected(0)" and exits 0.
          & $t.FullName LD
          if ($LASTEXITCODE -ne 0) { throw "upgrade_tool LD exited with $LASTEXITCODE" }

      - name: Upload launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows-logs
          path: |
            launch.out
            launch.err
          if-no-files-found: warn

  # The containers get only the test harness (xvfb, file), FUSE -- which the
  # AppImage runtime itself needs to self-mount -- and mesa, since graphics
  # drivers belong to the host. Everything else, libxcb and libxkbcommon in
  # particular, has to come out of the AppImage or it is not self-contained.
  smoke-linux:
    name: Smoke ${{ matrix.label }}
    needs: build-linux
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu2204
            label: Ubuntu 22.04
            image: ubuntu:22.04
            advisory: false
            install: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                file fuse libfuse2 libegl1 libgbm1 libopengl0 \
                libfontconfig1 libfreetype6 libx11-6 libxcb1 xauth xvfb
          - id: ubuntu2404
            label: Ubuntu 24.04
            image: ubuntu:24.04
            advisory: false
            install: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                file fuse3 libfuse2t64 libegl1 libgbm1 libopengl0 \
                libfontconfig1 libfreetype6 libx11-6 libxcb1 xauth xvfb
          - id: debian12
            label: Debian 12
            image: debian:12
            advisory: false
            install: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                file fuse3 libfuse2 libegl1 libgbm1 libopengl0 \
                libfontconfig1 libfreetype6 libx11-6 libxcb1 xauth xvfb
          - id: fedora40
            label: Fedora 40
            image: fedora:40
            advisory: false
            install: |
              dnf install -y \
                file findutils fuse fuse-libs mesa-libEGL mesa-libgbm \
                mesa-libGL fontconfig freetype libX11 libxcb \
                xauth xorg-x11-server-Xvfb
          - id: fedora41
            label: Fedora 41
            image: fedora:41
            advisory: true
            install: |
              dnf install -y \
                file findutils fuse fuse-libs mesa-libEGL mesa-libgbm \
                mesa-libGL fontconfig freetype libX11 libxcb \
                xauth xorg-x11-server-Xvfb
          - id: archlinux
            label: Arch Linux
            image: archlinux:latest
            advisory: true
            install: |
              pacman -Syu --noconfirm \
                file findutils fuse2 mesa fontconfig freetype2 libx11 libxcb \
                xorg-xauth xorg-server-xvfb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts

      - name: Run compatibility checks in container
        env:
          DISTRO_INSTALL: ${{ matrix.install }}
        run: |
          set -euo pipefail
          mkdir -p compat-logs/${{ matrix.id }}
          chmod +x scripts/check_appimage_compat.sh
          docker run --rm \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            -e DISTRO_INSTALL \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              eval "$DISTRO_INSTALL"
              chmod +x scripts/check_appimage_compat.sh
              LOG_DIR=/workspace/compat-logs/'"${{ matrix.id }}"' \
              RK_FLASH_TOOL_AUTO_EXIT_MS=2500 \
              RUN_TIMEOUT_SECONDS=20 \
              scripts/check_appimage_compat.sh /workspace/artifacts/Rockchip-Flash-Tool-linux-x86_64.AppImage
            '

      - name: Upload compatibility logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-linux-${{ matrix.id }}-logs
          path: compat-logs/${{ matrix.id }}
          if-no-files-found: warn

      - name: Append job summary
        if: always()
        run: |
          set -euo pipefail
          summary="compat-logs/${{ matrix.id }}/summary.md"
          reason_file="compat-logs/${{ matrix.id }}/failure_reason.txt"
          {
            echo "# ${{ matrix.label }}"
            echo
            if [[ -f "$summary" ]]; then
              cat "$summary"
            else
              echo "- Result: FAIL"
              if [[ -f "$reason_file" ]]; then
                echo "- Reason: $(cat "$reason_file")"
              else
                echo "- Reason: compatibility check did not produce a summary"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Single aggregate verdict for every run, release or not. This is the status
  # check to require on the branch, and what publishing hangs off.
  gate:
    name: Artifacts verified
    if: always()
    needs: [smoke-macos, smoke-windows, smoke-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check smoke results
        env:
          MACOS: ${{ needs.smoke-macos.result }}
          WINDOWS: ${{ needs.smoke-windows.result }}
          LINUX: ${{ needs.smoke-linux.result }}
        run: |
          set -euo pipefail
          printf 'macos:   %s\nwindows: %s\nlinux:   %s\n' "$MACOS" "$WINDOWS" "$LINUX"
          {
            echo "# Artifact verification"
            echo
            echo "| Platform | Result |"
            echo "|---|---|"
            echo "| macOS | $MACOS |"
            echo "| Windows | $WINDOWS |"
            echo "| Linux | $LINUX |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$MACOS" "$WINDOWS" "$LINUX"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::artifact verification did not pass"
              exit 1
            fi
          done
          echo "all platforms verified"

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts

      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts

      - name: Show what will be published
        run: ls -la artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Rockchip-Flash-Tool-macOS-universal.dmg
            artifacts/Rockchip-Flash-Tool-windows-x64.zip
            artifacts/Rockchip-Flash-Tool-linux-x86_64.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
